<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CineStream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: #0a0a0f;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120,40,200,.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(30,80,200,.15), transparent);
      min-height: 100vh;
    }

    .glass {
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.08);
    }

    .input-field {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      transition: border-color .2s, box-shadow .2s;
    }
    .input-field:focus {
      outline: none;
      border-color: rgba(139,92,246,.7);
      box-shadow: 0 0 0 3px rgba(139,92,246,.15);
    }

    .btn-login {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      transition: opacity .2s, transform .1s;
    }
    .btn-login:hover  { opacity: .9; }
    .btn-login:active { transform: scale(.98); }

    /* shake animation on error */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-8px); }
      40%,80%  { transform: translateX(8px); }
    }
    .shake { animation: shake .4s ease; }

    /* spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

  <!-- Card -->
  <div class="glass rounded-2xl w-full max-w-sm p-8 shadow-2xl" id="card">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600
                  flex items-center justify-center mb-4 shadow-lg shadow-violet-900/40">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/>
        </svg>
      </div>
      <h1 class="text-white text-xl font-semibold tracking-tight">CineStream Admin</h1>
      <p class="text-white/40 text-sm mt-1">Đăng nhập để tiếp tục</p>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <!-- Username -->
      <div class="mb-4">
        <label class="block text-white/60 text-xs font-medium mb-1.5 uppercase tracking-wider">
          Tài khoản
        </label>
        <input id="username" type="text" autocomplete="username" placeholder="admin"
               class="input-field w-full rounded-xl px-4 py-3 text-white text-sm placeholder-white/20" />
      </div>

      <!-- Password -->
      <div class="mb-6 relative">
        <label class="block text-white/60 text-xs font-medium mb-1.5 uppercase tracking-wider">
          Mật khẩu
        </label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
               class="input-field w-full rounded-xl px-4 py-3 pr-11 text-white text-sm placeholder-white/20" />
        <button type="button" id="togglePwd"
                class="absolute right-3 top-[38px] text-white/30 hover:text-white/60 transition-colors">
          <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0
                     8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5
                     12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          </svg>
        </button>
      </div>

      <!-- Error -->
      <div id="errorMsg"
           class="hidden bg-red-500/10 border border-red-500/30 text-red-400
                  text-sm rounded-xl px-4 py-3 mb-4 flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75
                0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1
                0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/>
        </svg>
        <span id="errorText">Sai tài khoản hoặc mật khẩu</span>
      </div>

      <!-- Submit -->
      <button id="submitBtn" type="submit"
              class="btn-login w-full rounded-xl py-3 text-white text-sm font-semibold
                     flex items-center justify-center gap-2">
        <span id="btnText">Đăng nhập</span>
        <div id="btnSpinner" class="spinner hidden"></div>
      </button>
    </form>

    <p class="text-white/20 text-xs text-center mt-6">
      CineStream VOD System &bull; Protected Area
    </p>
  </div>

  <script>
    const form       = document.getElementById('loginForm');
    const card       = document.getElementById('card');
    const errorMsg   = document.getElementById('errorMsg');
    const errorText  = document.getElementById('errorText');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const submitBtn  = document.getElementById('submitBtn');

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    function setLoading(on) {
      submitBtn.disabled = on;
      btnText.textContent = on ? 'Đang xác thực…' : 'Đăng nhập';
      btnSpinner.classList.toggle('hidden', !on);
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.remove('hidden');
      card.classList.remove('shake');
      void card.offsetWidth;           // reflow để reset animation
      card.classList.add('shake');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Vui lòng nhập đầy đủ tài khoản và mật khẩu');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });

        if (res.ok) {
          window.location.replace('/admin.html');
        } else {
          const data = await res.json().catch(() => ({}));
          showError(data.detail || 'Sai tài khoản hoặc mật khẩu');
        }
      } catch {
        showError('Không kết nối được server. Thử lại sau.');
      } finally {
        setLoading(false);
      }
    });

    // Auto-focus username
    document.getElementById('username').focus();
  </script>
</body>
</html>
